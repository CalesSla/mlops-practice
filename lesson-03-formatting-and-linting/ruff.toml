line-length = 88

target-version = "py311"

[lint]
# Выберите набор правил для анализа кода:
# E — ошибки стиля (pycodestyle)
# F — ошибки, связанные с переменными, импортами и т. д. (pyflakes)
# I — сортировка импортов (аналог isort)
# B — best practices из flake8-bugbear
select = ["E", "F", "I", "B", "Q"]

fixable = ["E", "F", "I", "B", "Q"]

[format]
quote-style = "double"

skip-magic-trailing-comma = false

indent-style = "space"

line-ending = "auto"